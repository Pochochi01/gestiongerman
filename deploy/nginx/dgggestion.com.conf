# ============================================================================
#  DGG Gestión · nginx · dgggestion.com
#
#  Copiar a:   /etc/nginx/sites-available/dgggestion.com.conf
#  Validar:    sudo nginx -t
#  Recargar:   sudo systemctl reload nginx
#
#  Los valores ya están puestos con los de tu VPS:
#    dominio   dgggestion.com / www.dgggestion.com
#    frontend  /var/www/proyectos-mysql/gestiongerman/frontend/dist
#    backend   127.0.0.1:5006   (el PORT de backend/.env)
#
#  Para HTTPS, después de que esto funcione:
#    sudo certbot --nginx -d dgggestion.com -d www.dgggestion.com
#  Certbot edita este archivo solo: agrega el bloque 443 y la redirección.
# ============================================================================

# La API de Node. Declarar el puerto acá lo deja en un solo lugar.
upstream dgggestion_api {
    server 127.0.0.1:5006;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name dgggestion.com www.dgggestion.com;

    # ------------------------------------------------------------------------
    #  El `root` va a nivel de server, NO dentro de un location.
    #  Así lo heredan todos los bloques y la SPA se sirve desde cualquier ruta.
    # ------------------------------------------------------------------------
    root /var/www/proyectos-mysql/gestiongerman/frontend/dist;
    index index.html;

    # multer acepta 5 MB (UPLOAD_MAX_MB). El default de nginx es 1 MB, así que
    # sin esto los comprobantes de más de 1 MB fallan con 413 antes de llegar
    # a la aplicación.
    client_max_body_size 10m;

    access_log /var/log/nginx/dgggestion.access.log;
    error_log  /var/log/nginx/dgggestion.error.log;

    # ---- Compresión: el bundle pasa de ~320 KB a ~148 KB ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # ---- Cabeceras para lo que sirve nginx (helmet sólo cubre /api) ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    # ========================================================================
    #  LA API  ->  al proceso de Node, NO a archivos
    # ========================================================================
    #  Esto es lo que faltaba: antes `/api` servía archivos estáticos desde
    #  dist/, así que la API nunca se alcanzaba.
    location /api/ {
        proxy_pass http://dgggestion_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Imprescindible: sin esta cabecera Express ve 127.0.0.1 como IP de
        # todos los pedidos y el límite de 20 logins cada 15 minutos pasa a ser
        # global. El backend la lee gracias a TRUST_PROXY=1.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;

        # Que el JSON de error de la aplicación llegue tal cual al frontend.
        proxy_intercept_errors off;
    }

    # ========================================================================
    #  PDFs y comprobantes (los sirve Express con express.static)
    # ========================================================================
    location /uploads/ {
        proxy_pass http://dgggestion_api;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        expires 1h;
    }

    # ========================================================================
    #  Estáticos de Vite: llevan hash en el nombre, son inmutables
    # ========================================================================
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ========================================================================
    #  LA SPA
    # ========================================================================
    #  React Router resuelve /login, /validar/:token, /admin/..., /vendedor/...
    #  y /jugador/... en el navegador. nginx no tiene esos archivos, así que
    #  cualquier ruta desconocida devuelve index.html.
    #
    #  Esto es lo otro que faltaba: sin `location /`, la raíz del sitio no se
    #  servía y entrar directo a /validar/<token> daba error.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html NUNCA se cachea: si quedara cacheado, después de un deploy el
    # navegador pediría archivos con hashes que ya no existen y la aplicación
    # quedaría en blanco.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires 0;
    }

    # Nada de archivos ocultos (.env, .git), salvo el desafío de certbot.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
