# ============================================================================
#  DGG Gestión · nginx
#
#  Copiar como:  /etc/nginx/sites-available/bingodgg
#  Activar con:  ln -s /etc/nginx/sites-available/bingodgg /etc/nginx/sites-enabled/
#
#  REEMPLAZAR antes de usar (son los únicos tres valores):
#    1. bingo.tudominio.com   ->  tu dominio
#    2. /var/www/bingodgg     ->  la ruta real del proyecto en el VPS
#    3. 127.0.0.1:5006        ->  el PORT de backend/.env (hoy 5006)
#
#  Este archivo sirve HTTP (puerto 80). Para HTTPS:
#    sudo certbot --nginx -d bingo.tudominio.com
#  Certbot edita este mismo archivo, agrega el bloque 443 y la redirección.
#  No hace falta tocarlo a mano.
# ============================================================================

# El backend de Node. Nombrarlo acá permite cambiar el puerto en un solo lugar.
upstream bingodgg_api {
    server 127.0.0.1:5006;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name bingo.tudominio.com;

    # ---- El frontend compilado (npm run build en frontend/) ----
    root /var/www/bingodgg/frontend/dist;
    index index.html;

    # Tamaño máximo de subida. multer acepta 5 MB (UPLOAD_MAX_MB), así que un
    # límite de nginx menor haría fallar los comprobantes con 413 ANTES de
    # llegar a la aplicación. El default de nginx es 1 MB: hay que subirlo.
    client_max_body_size 10m;

    # Logs propios del sitio: separados del resto facilita diagnosticar.
    access_log /var/log/nginx/bingodgg.access.log;
    error_log  /var/log/nginx/bingodgg.error.log;

    # ---- Compresión ----
    # El bundle pesa ~320 KB y baja a ~148 KB comprimido.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        image/svg+xml application/pdf;

    # ---- Cabeceras de seguridad para los archivos estáticos ----
    # (helmet ya las pone en las respuestas de /api, pero no en lo que sirve nginx)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    # ========================================================================
    #  API
    # ========================================================================
    location /api/ {
        proxy_pass http://bingodgg_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Sin esta cabecera, Express ve 127.0.0.1 como IP de todos los pedidos
        # y los límites por IP (login, validación) se vuelven globales.
        # El backend la lee gracias a TRUST_PROXY=1.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # La generación del PDF y la carga de números tardan poco, pero el
        # aviso a los ganadores recorre varios jugadores.
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;

        # Que los errores de la aplicación lleguen tal cual al cliente: el
        # frontend muestra el mensaje de `{ ok:false, error }`.
        proxy_intercept_errors off;
    }

    # ========================================================================
    #  Archivos subidos y PDFs emitidos
    # ========================================================================
    # Los sirve Express (`app.use('/uploads', express.static(...))`), así que se
    # proxyean. Alternativa más rápida, si nginx puede leer la carpeta:
    #
    #   location /uploads/ {
    #       alias /var/www/bingodgg/backend/uploads/;
    #       expires 1h;
    #   }
    #
    # Ojo con los permisos: www-data necesita poder recorrer toda la ruta.
    location /uploads/ {
        proxy_pass http://bingodgg_api;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        expires 1h;
    }

    # ========================================================================
    #  Estáticos del frontend
    # ========================================================================
    # Vite les pone un hash en el nombre (index-a1b2c3d4.js), así que son
    # inmutables: se pueden cachear para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ========================================================================
    #  La SPA
    # ========================================================================
    # React Router maneja /login, /validar/:token, /admin/..., /vendedor/...,
    # /jugador/... en el navegador. nginx no tiene esos archivos, así que
    # cualquier ruta desconocida devuelve index.html y la resuelve el cliente.
    #
    # `index.html` NO se cachea: si quedara cacheado, después de un deploy el
    # navegador pediría archivos con hashes que ya no existen y la aplicación
    # quedaría en blanco.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires 0;
    }

    # No servir archivos ocultos ni restos de despliegue.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
